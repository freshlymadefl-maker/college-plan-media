name: Transcribe audio
# Transcribes audio files pushed to transcribe/*.wav and commits a matching .txt with timestamps.
on:
  push:
    paths: ['transcribe/*.wav']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q faster-whisper
      - name: Transcribe
        run: |
          python - <<'PY'
          import glob, os
          from faster_whisper import WhisperModel
          m = WhisperModel("small.en", device="cpu", compute_type="int8")
          for f in glob.glob("transcribe/*.wav"):
              out = f[:-4] + ".txt"
              if os.path.exists(out): continue
              segs, _ = m.transcribe(f, vad_filter=True)
              with open(out, "w") as o:
                  for s in segs: o.write(f"[{s.start:5.1f}-{s.end:5.1f}] {s.text.strip()}\n")
          PY
          git rm -q transcribe/*.wav
      - name: Commit
        run: |
          git config user.name "College Plan"
          git config user.email freshlymadefl@gmail.com
          git add -A
          git diff --cached --quiet && exit 0; git commit -m "Transcribe audio"; for i in 1 2 3 4 5; do git pull --rebase -q && git push && exit 0; sleep $((i*4)); done; exit 1
