<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Fredoka;font-weight:600;src:url(../../fonts/fredoka-600.woff2)}
@font-face{font-family:Fredoka;font-weight:700;src:url(../../fonts/fredoka-700.woff2)}
*{margin:0;box-sizing:border-box}html,body{background:transparent}
.o{position:relative;width:1080px;height:1920px;font-family:Fredoka}
.card{position:absolute;left:70px;right:70px;top:270px;background:#fff6e9;border-radius:48px;padding:46px 54px 56px;box-shadow:0 14px 0 #7d0a1d;text-align:center}
.card h1{font:700 82px/1 Fredoka;color:#c8102e}
.card h1 span{color:#1f6f43}
.pill{position:absolute;left:50%;top:290px;transform:translateX(-50%) rotate(-2deg);background:#fff6e9;border-radius:80px;padding:26px 54px;font:700 76px/1 Fredoka;color:#1f6f43;white-space:nowrap;box-shadow:0 12px 0 #7d0a1d}
.pill b{color:#c8102e}
.cta{position:absolute;left:50%;top:1490px;transform:translateX(-50%) rotate(2deg);background:#1f6f43;color:#fff6e9;border-radius:80px;padding:24px 52px;font:700 60px/1 Fredoka;white-space:nowrap;box-shadow:0 10px 0 #0b2e1c}
.sp{position:absolute;color:#fff6e9;font:700 50px Fredoka;text-shadow:0 4px 0 #7d0a1d}
</style></head><body>
<div class="o" id="hook"><div class="card"><h1>Me realizing I have <span>14 people</span> to make gifts for this year</h1></div><div class="sp" style="left:60px;top:228px">✦</div><div class="sp" style="right:64px;top:600px">✻</div></div>
<div class="o" id="mom"><div class="pill"><b>Mom:</b> cocoa mug ✓</div></div>
<div class="o" id="grandma"><div class="pill"><b>Grandma:</b> handprint plate ✓</div></div>
<div class="o" id="bestie"><div class="pill"><b>Bestie:</b> s'more plate ✓</div></div>
<div class="o" id="me"><div class="pill"><b>Me:</b> basically Santa now</div><div class="cta">Walk-ins welcome! ✦ Valrico</div></div>
</body></html>
