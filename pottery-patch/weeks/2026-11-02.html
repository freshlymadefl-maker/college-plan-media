<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Fredoka;font-weight:600;src:url(../fonts/fredoka-600.woff2)}
@font-face{font-family:Fredoka;font-weight:700;src:url(../fonts/fredoka-700.woff2)}
*{box-sizing:border-box;margin:0}
body{background:#ccc;font-family:Fredoka}
.post{position:relative;width:1080px;height:1350px;overflow:hidden;margin-bottom:40px}
h1{font-weight:700;text-align:center;letter-spacing:-.5px}
.handle{position:absolute;right:40px;bottom:36px;font:600 30px Fredoka;padding:10px 26px;border-radius:40px}
.sp{position:absolute;font-weight:700;line-height:1}
.dot{position:absolute;border-radius:50%}
.sticker{position:absolute;font:700 44px Fredoka;padding:14px 38px;border-radius:60px;white-space:nowrap}

/* ===== Nov 4: cocoa mug, framed (layout 4), candy red ===== */
#p1104{background:#c8102e}
#p1104 h1{position:absolute;top:70px;left:60px;right:60px;font-size:92px;line-height:.98;color:#fff6e9}
#p1104 h1 span{color:#cfe8f7}
#p1104 .frame{position:absolute;left:150px;top:340px;width:780px;height:920px;background:#fff6e9;padding:26px 26px 90px;transform:rotate(-2.5deg);box-shadow:0 18px 0 #7d0a1d;border-radius:14px}
#p1104 .frame div{width:100%;height:100%;border-radius:8px;background:url(../library/photo/5769-cocoa-mug.jpg) center 45%/cover}
#p1104 .sticker{left:540px;top:1185px;background:#cfe8f7;color:#7d0a1d;transform:rotate(4deg);box-shadow:0 8px 0 #7d0a1d}
#p1104 .handle{background:#fff6e9;color:#c8102e;left:40px;right:auto}

/* ===== Nov 5: girl math, meme layout 2, blush/orange from plate ===== */
#p1105 #band{position:absolute;top:0;left:0;right:0;height:430px;background:#f9d3e0;border-bottom:16px solid #7a1730;display:flex;align-items:center;justify-content:center;padding:0 70px 20px}
#p1105 h1{font-size:88px;line-height:.98;color:#7a1730}
#p1105 h1 span{color:#e8641e}
#p1105 .photo{position:absolute;top:430px;left:0;right:0;bottom:0;background:url(../library/photo/5754-locks-of-love.jpg) center 52%/cover}
#p1105 .sticker{left:300px;top:398px;background:#e8641e;color:#fff6e9;transform:rotate(-3deg);box-shadow:0 8px 0 #7a1730}
#p1105 .handle{background:#7a1730;color:#f9d3e0}

/* ===== Nov 7: handprint plate, photo + color band (layout 1), icy blue ===== */
#p1107 .photo{position:absolute;inset:0;background:url(../library/photo/5776-handprint-plate.jpg) 70% 6%/cover}
#p1107 .block{position:absolute;top:54px;left:54px;right:54px;background:#2b6cb0;border-radius:44px;padding:44px 50px 60px;box-shadow:0 14px 0 #163f6b}
#p1107 h1{font-size:84px;line-height:1;color:#fff}
#p1107 h1 span{color:#cfe8f7}
#p1107 .sticker{right:90px;top:400px;background:#fff;color:#2b6cb0;transform:rotate(3deg);box-shadow:0 8px 0 #163f6b}
#p1107 .handle{background:#2b6cb0;color:#fff}
</style></head><body>

<div class="post" id="p1104">
  <div class="sp" style="left:60px;top:300px;font-size:46px;color:#cfe8f7">✻</div>
  <div class="sp" style="right:70px;top:290px;font-size:40px;color:#fff6e9">✦</div>
  <div class="sp" style="left:70px;top:900px;font-size:54px;color:#fff6e9">✻</div>
  <div class="sp" style="right:52px;top:760px;font-size:44px;color:#cfe8f7">✻</div>
  <div class="dot" style="left:96px;top:1120px;width:22px;height:22px;background:#cfe8f7"></div>
  <div class="dot" style="right:96px;top:620px;width:18px;height:18px;background:#fff6e9"></div>
  <h1><span>Cocoa season</span> called. It wants a cuter mug.</h1>
  <div class="frame"><div></div></div>
  <div class="sticker">No art skills required</div>
  <div class="handle">@thepotterypatch</div>
</div>

<div class="post" id="p1105">
  <div id="band">
    <div class="sp" style="left:44px;top:40px;font-size:46px;color:#e8641e">✦</div>
    <div class="sp" style="right:52px;top:52px;font-size:34px;color:#7a1730">✦</div>
    <div class="sp" style="right:90px;top:300px;font-size:40px;color:#e8641e">✦</div>
    <div class="dot" style="left:80px;top:320px;width:18px;height:18px;background:#7a1730"></div>
    <div class="dot" style="right:150px;top:120px;width:14px;height:14px;background:#e8641e"></div>
    <h1><span>Girl math:</span> if you painted it, the gift was basically free.</h1>
  </div>
  <div class="photo"></div>
  <div class="sticker">Walk-ins welcome!</div>
  <div class="handle">@thepotterypatch</div>
</div>

<div class="post" id="p1107">
  <div class="photo"></div>
  <div class="block">
    <div class="sp" style="left:30px;top:24px;font-size:38px;color:#cfe8f7">✻</div>
    <div class="sp" style="right:34px;top:30px;font-size:30px;color:#fff">✻</div>
    <h1>Tiny hand now. <span>Grandma's favorite gift</span> forever.</h1>
  </div>
  <div class="sticker">Gift list: handled</div>
  <div class="handle">@thepotterypatch</div>
</div>
</body></html>
