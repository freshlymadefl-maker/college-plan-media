<style>

.tag{position:absolute;left:150px;right:150px;background:#F6EBD9;border-radius:26px;text-align:center;padding:46px 30px 40px;z-index:5;box-shadow:12px 12px 0 #3d0b0b}

.tag small{display:block;font:700 26px DMSans;letter-spacing:6px;color:#9c7b33;text-transform:uppercase}
.tag b{display:block;font:900 150px Fraunces;letter-spacing:4px;color:#B3261E;line-height:1.05;font-variation-settings:"SOFT" 100,"WONK" 1}
.tag span{display:block;font:italic 500 40px Fraunces;color:#1F4D3A}
.sub{position:absolute;left:90px;right:90px;text-align:center;color:#FFF3DF;font:italic 400 46px Fraunces;line-height:1.2;z-index:5}
.sticker{position:absolute;left:0;right:0;text-align:center;color:#FFE7B8;font:700 26px DMSans;letter-spacing:4px;text-transform:uppercase;z-index:5}
.sticker i{display:inline-block;border:3px dashed rgba(255,231,184,.7);border-radius:20px;padding:22px 40px;font-style:normal}
.fine{position:absolute;left:60px;right:60px;text-align:center;color:rgba(255,231,184,.85);font:500 22px DMSans;z-index:5}
.handle{position:absolute;left:0;right:0;text-align:center;color:#FFE7B8;font:600 24px DMSans;letter-spacing:5px;text-transform:uppercase;z-index:5}
.fade{position:absolute;inset:0;z-index:49;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(40,10,5,.45) 100%)}
.grain{position:absolute;inset:-10px;pointer-events:none;z-index:50;opacity:.25;mix-blend-mode:multiply;
 background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .18  0 0 0 .9 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
</style></head><body>
<div id="tinsel"></div>

<div class="handle" id="hd">@cozylittlefindsdaily</div>
<div class="fade"></div><div class="grain"></div>
<script>
const f=new URLSearchParams(location.search).get('f')||'story';
const L=f==='story'?{k:300,h:390,t:720,s:1150,st:1330,f:1720,hd:1800,tin:420}:{k:150,h:230,t:530,s:900,st:null,f:1210,hd:1280,tin:300};
if(f==='post')document.body.classList.add('post');
for(const id of ['k','h','t','s','st','f','hd']){const e=document.getElementById(id);if(L[id]==null)e.style.display='none';else e.style.top=L[id]+'px'}
if(f==='post'){document.getElementById('s').innerHTML+='<br><span style="font-size:32px;color:#FFE7B8">link in bio</span>'}

const T=document.getElementById('tinsel');
for(let i=0;i<200;i++){const e=document.createElement('i');const c=cols[Math.floor(r()*cols.length)];
 e.style.left=(r()*1090-5)+'px';e.style.height=(60+r()*r()*L.tin)+'px';e.style.width=(3+r()*6)+'px';
 e.style.background='repeating-linear-gradient(180deg,'+c+' 0 7px,rgba(255,255,255,.7) 7px 8px,'+c+' 8px 23px,rgba(0,0,0,.18) 23px 24px)';
 e.style.opacity=.5+r()*.45;T.appendChild(e)}
</script></body></html>
