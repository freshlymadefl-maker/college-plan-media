<!doctype html>
<html><head><meta charset="utf-8">
<!-- Instagram Story Highlight covers (1080x1920). Instagram crops to the center circle, so the icon sits dead center.
     Bright pastel Florida palette: sky, sunshine, seafoam. Chunky navy icons + a gold sparkle. -->
<style>
* { box-sizing:border-box; margin:0; }
body { background:#888; }
.h { width:1080px; height:1920px; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.sky  { background:linear-gradient(150deg,#CFE6FD 0%,#A3CEF7 50%,#7FB6EE 100%); }
.sun  { background:linear-gradient(150deg,#FFF0A8 0%,#FFE070 50%,#FFCF3D 100%); }
.sea  { background:linear-gradient(150deg,#C9F5E5 0%,#9BE6CB 50%,#6FD6B2 100%); }
.blob { position:absolute; width:760px; height:760px; border-radius:50%; display:none; }
svg.ic { position:relative; width:440px; height:440px; fill:none; stroke:#0B2A4A; stroke-width:7.5; stroke-linecap:round; stroke-linejoin:round; }
svg.ic .f { fill:#0B2A4A; stroke:none; }
svg.ic .w { fill:#FFFFFF; }
.spark { position:absolute; width:120px; height:120px; left:690px; top:700px; }
.spark2 { position:absolute; width:62px; height:62px; left:340px; top:1150px; }
.spark path, .spark2 path { fill:#FFFFFF; }
.sun .spark path, .sun .spark2 path { fill:#FFFFFF; }
</style></head><body>

<div class="h sky" id="hl-deadlines"><div class="blob"></div>
<svg class="ic" viewBox="0 0 100 100">
  <rect x="16" y="22" width="68" height="62" rx="12" class="w"/>
  <path d="M16 40 H84"/>
  <path d="M34 13 V28 M66 13 V28"/>
  <rect x="30" y="50" width="12" height="11" rx="3" class="f"/>
  <rect x="58" y="50" width="12" height="11" rx="3" class="f" style="opacity:.25"/>
  <rect x="30" y="67" width="12" height="9" rx="3" class="f" style="opacity:.25"/>
  <rect x="44" y="50" width="12" height="11" rx="3" class="f" style="opacity:.25"/>
</svg>
<svg class="spark" viewBox="0 0 24 24"><path d="M12 0 C13 8 16 11 24 12 C16 13 13 16 12 24 C11 16 8 13 0 12 C8 11 11 8 12 0Z"/></svg>
<svg class="spark2" viewBox="0 0 24 24"><path d="M12 0 C13 8 16 11 24 12 C16 13 13 16 12 24 C11 16 8 13 0 12 C8 11 11 8 12 0Z"/></svg>
</div>

<div class="h sun" id="hl-bf"><div class="blob"></div>
<svg class="ic" viewBox="0 0 100 100">
  <path d="M28 52 V68 C28 74 39 80 50 80 C61 80 72 74 72 68 V52" class="w"/>
  <path d="M6 42 L50 23 L94 42 L50 61 Z" class="w"/>
  <path d="M86 46 V64"/>
  <circle cx="86" cy="68" r="4.5" class="f"/>
</svg>
<svg class="spark" viewBox="0 0 24 24"><path d="M12 0 C13 8 16 11 24 12 C16 13 13 16 12 24 C11 16 8 13 0 12 C8 11 11 8 12 0Z"/></svg>
<svg class="spark2" viewBox="0 0 24 24"><path d="M12 0 C13 8 16 11 24 12 C16 13 13 16 12 24 C11 16 8 13 0 12 C8 11 11 8 12 0Z"/></svg>
</div>

<div class="h sea" id="hl-tools"><div class="blob"></div>
<svg class="ic" viewBox="0 0 100 100">
  <rect x="26" y="14" width="48" height="74" rx="11" class="w"/>
  <path d="M43 22 H57"/>
  <path d="M37 46 l7 7 l14 -15"/>
  <path d="M38 66 H62 M38 75 H54"/>
</svg>
<svg class="spark" viewBox="0 0 24 24"><path d="M12 0 C13 8 16 11 24 12 C16 13 13 16 12 24 C11 16 8 13 0 12 C8 11 11 8 12 0Z"/></svg>
<svg class="spark2" viewBox="0 0 24 24"><path d="M12 0 C13 8 16 11 24 12 C16 13 13 16 12 24 C11 16 8 13 0 12 C8 11 11 8 12 0Z"/></svg>
</div>

</body></html>
