<!doctype html>
<html><head><meta charset="utf-8">
<!-- Instagram Story Highlight covers (1080x1920). Instagram crops to the center circle, so the icon sits dead center. -->
<style>
* { box-sizing:border-box; margin:0; }
body { background:#888; }
.h { width:1080px; height:1920px; position:relative; background:radial-gradient(circle at 50% 50%, #123B66 0%, #0B2A4A 55%, #081F38 100%); display:flex; align-items:center; justify-content:center; }
.ring { width:620px; height:620px; border-radius:50%; border:10px solid #B5A21F; display:flex; align-items:center; justify-content:center; }
.ring svg { width:330px; height:330px; fill:none; stroke:#FFFFFF; stroke-width:7; stroke-linecap:round; stroke-linejoin:round; }
.ring svg .g { stroke:#F1E27A; }
</style></head><body>

<!-- Tools: wrench + spark -->
<div class="h" id="hl-tools"><div class="ring">
<svg viewBox="0 0 100 100">
  <rect x="14" y="20" width="72" height="60" rx="10"/>
  <path d="M14 34 H86"/>
  <circle cx="23" cy="27" r="1.5" class="g"/><circle cx="30" cy="27" r="1.5" class="g"/>
  <path d="M28 52 l8 8 l16 -16" class="g"/>
  <path d="M60 50 H74 M60 62 H70"/>
</svg></div></div>

<!-- Deadlines: calendar -->
<div class="h" id="hl-deadlines"><div class="ring">
<svg viewBox="0 0 100 100">
  <rect x="16" y="22" width="68" height="62" rx="9"/>
  <path d="M16 38 H84"/>
  <path d="M34 14 V28 M66 14 V28"/>
  <circle cx="50" cy="61" r="12" class="g"/>
  <path d="M50 54 V61 L55 65" class="g"/>
</svg></div></div>

<!-- Bright Futures: graduation cap + star -->
<div class="h" id="hl-bf"><div class="ring">
<svg viewBox="0 0 100 100">
  <path d="M8 42 L50 24 L92 42 L50 60 Z"/>
  <path d="M26 50 V68 C26 74 38 80 50 80 C62 80 74 74 74 68 V50"/>
  <path d="M86 45 V64"/>
  <path d="M82 18 l2.2 4.6 5 .7 -3.6 3.5 .9 5 -4.5 -2.4 -4.5 2.4 .9 -5 -3.6 -3.5 5 -.7z" class="g"/>
</svg></div></div>

</body></html>
