<!doctype html><html><head><meta charset="utf-8">
<!-- Product card images (1200x1200) for beehiiv digital products -->
<style>
* { box-sizing:border-box; margin:0; }
.c { width:1200px; height:1200px; position:relative; overflow:hidden; font-family:'Inter',sans-serif; background:linear-gradient(150deg,#F4F9FE 0%,#EAF3FB 50%,#D4E6F7 100%); }
.c.alt { background:linear-gradient(150deg,#FFFBEA 0%,#FFF0B3 55%,#FFE07A 100%); }
.pill { position:absolute; left:80px; top:80px; font-family:'Poppins'; font-weight:600; font-size:26px; letter-spacing:.14em; text-transform:uppercase; color:#fff; background:#0B2A4A; border-radius:999px; padding:12px 26px; }
h1 { position:absolute; left:80px; top:160px; right:80px; font-family:'Poppins'; font-weight:700; font-size:76px; line-height:1.02; color:#0B2A4A; letter-spacing:-.02em; }
h1 em { font-family:'Lora'; font-style:italic; font-weight:500; color:#5B8DC9; letter-spacing:0; }
.alt h1 em { color:#9A7A00; }
.pg { position:absolute; width:470px; box-shadow:0 30px 70px rgba(11,42,74,.35); border-radius:8px; }
.a { left:110px; top:430px; transform:rotate(-5deg); }
.b { left:600px; top:440px; transform:rotate(4deg); }
.badge { position:absolute; right:70px; top:380px; width:170px; height:170px; border-radius:50%; background:#B5A21F; color:#fff; font-family:'Poppins'; font-weight:700; font-size:34px; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1; transform:rotate(10deg); box-shadow:0 14px 34px rgba(0,0,0,.25); z-index:3; text-align:center; }
.badge small { display:block; font-size:18px; letter-spacing:.08em; font-weight:600; margin-top:6px; }
</style></head><body>
<div class="c" id="senior"><span class="pill">Class of 2027 · Florida</span><h1>The Senior Year <em>Roadmap</em></h1>
<img class="pg a" src="sr-p-01.png"><img class="pg b" src="sr-p-04.png"><div class="badge">10<small>PAGES</small></div></div>
<div class="c alt" id="freshman"><span class="pill">9th grade · Florida</span><h1>The Freshman <em>Roadmap</em></h1>
<img class="pg a" src="fr-p-01.png"><img class="pg b" src="fr-p-05.png"><div class="badge">10<small>PAGES</small></div></div>
</body></html>
